
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Book | Library</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .container {
            max-width: 720px;
            margin: 40px auto;
            padding: 28px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 28px #17203312;
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd4e0;
            border-radius: 8px;
            font-size: 16px;
        }

        button, .button {
            display: inline-block;
            border: 0;
            border-radius: 8px;
            padding: 11px 16px;
            background: #3157d5;
            color: white;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
        }

        .secondary {
            background: #e9eef8;
            color: #172033;
        }

        .errors {
            padding: 12px 16px;
            background: #fff0f0;
            color: #a32020;
            border-radius: 8px;
        }

        .current-image {
            display: block;
            max-width: 180px;
            max-height: 180px;
            object-fit: cover;
            margin-top: 10px;
            border-radius: 10px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Edit Book</h1>

        <p>Update the information below.</p>

        {% if errors %}
        <div class="errors">
            {% for error in errors %}
                <p>{{ error }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">

            <label for="title">Book Title</label>
            <input
                id="title"
                name="title"
                maxlength="200"
                required
                value="{{ book[1] }}"
            >

            <label for="price">Price</label>
            <input
                id="price"
                name="price"
                type="number"
                min="0"
                step="0.01"
                required
                value="{{ book[2] }}"
            >

            <label for="author_id">Author</label>
            <select id="author_id" name="author_id" required>
                {% for author_option in authors %}
                <option
                    value="{{ author_option[0] }}"
                    {% if author_option[0] == book[3] %}selected{% endif %}
                >
                    {{ author_option[1] }}
                </option>
                {% endfor %}
            </select>

            <label for="book_image">Book Cover (optional)</label>

            {% if book[4] %}
            <img
                class="current-image"
                src="{{ url_for('static', filename=book[4]) }}"
                alt="Current book cover"
            >
            {% endif %}

            <input
                id="book_image"
                name="book_image"
                type="file"
                accept=".jpg,.jpeg,.png,.webp"
            >

            <div class="actions">
                <button type="submit">Save Changes</button>
                <a class="button secondary" href="{{ url_for('library') }}">
                    Cancel
                </a>
            </div>

        </form>
    </main>
</body>
</html>
