<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <main class="todo-container">
        <h1>Add Book</h1>

        {% for error in errors %}
            <p class="error">{{ error }}</p>
        {% endfor %}

        {% if authors %}
            <form method="POST" enctype="multipart/form-data">
                <label for="title">Book Title</label>
                <input type="text" id="title" name="title"
                       maxlength="200" required>

                <label for="price">Price</label>
                <input type="number" id="price" name="price"
                       min="0" step="0.01" required>

                <label for="author_id">Author</label>
                <select id="author_id" name="author_id" required>
                    <option value="">Choose an author</option>

                    {% for author in authors %}
                        <option value="{{ author[0] }}">
                            {{ author[1] }} (ID: {{ author[0] }})
                        </option>
                    {% endfor %}
                </select>

                <!-- Bonus: Book Cover -->
                <label for="book_image">Book Cover Image</label>
                <input type="file" id="book_image"
                       name="book_image"
                       accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp">

                <button type="submit">Add Book</button>
            </form>
        {% else %}
            <p>Add an author before adding a book.</p>
            <a href="/add_author">Add Author</a>
        {% endif %}

        <p><a href="/library">Back to Library</a></p>
    </main>

</body>
</html>
